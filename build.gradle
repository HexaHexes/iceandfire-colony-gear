plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = 'org.bitwisemadness'

base {
    archivesName = 'iceandfire-colony-gear'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = '21.1.259'

    // In-repo gametest run. NeoForge's patched net.minecraft.server.Main reads
    // -Dneoforge.gameTestServer and boots a headless GameTestServer in this
    // project's own run/ folder - no CurseForge instance involved.
    runs {
        gametest {
            server()
            gameDirectory = project.layout.projectDirectory.dir('run')
            systemProperty 'neoforge.gameTestServer', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'iceandfire_colony_gear'
        }
    }

    mods {
        iceandfire_colony_gear {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    // Runtime closure for the gametest run: staged into run/mods below.
    gametestMods
}

repositories {
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
    }
    mavenCentral()
}

dependencies {
    // Compile-only against MineColonies' public API (registerItemTier /
    // getItemLevel). Ice and Fire is never referenced at compile time - the
    // ladder keys off IafToolMaterials enum constant names and registry-path
    // fragments at runtime. Coordinates are CurseMaven so a clean checkout
    // resolves every jar - never gitignored libs/ or testmods/.
    compileOnly 'curse.maven:minecolonies-245506:9058295' // minecolonies-1.1.1403-1.21.1

    gametestMods 'curse.maven:architectury-419699:8492726'
    gametestMods 'curse.maven:blockui-522992:7541336'
    gametestMods 'curse.maven:cloth-config-348521:5729127'
    gametestMods 'curse.maven:domum-ornamentum-527361:8784713'
    gametestMods 'curse.maven:iceandfire-ce-1040076:7722420' // IceAndFireCE-2.0-beta.15 (pinned)
    gametestMods 'curse.maven:jupiter-1072905:7738312' // jupiter-2.3.7 (IaF hard requirement)
    gametestMods 'curse.maven:minecolonies-245506:9058295'
    gametestMods 'curse.maven:structurize-298744:8610535'
    gametestMods 'curse.maven:terrablender-940057:6054947'
    gametestMods 'curse.maven:uranus-1010827:8587525' // uranus-2.4.1 (IaF hard requirement)
}

// --- gametest harness -------------------------------------------------------

// Stage the pack's dependency mod jars into the run's production-style mods/
// folder, where FML's mods-folder locator finds them exactly like in the pack.
tasks.register('prepareGametestMods', Sync) {
    from configurations.gametestMods
    into 'run/mods'
}

tasks.matching { it.name == 'runGametest' }.configureEach {
    dependsOn 'prepareGametestMods'

    // GameTestServer prints "All N required tests passed :)" or "N required
    // tests failed :(" when the run finishes; grade that so the Gradle build
    // is green/red on its own (crashes fail via the java exit code anyway).
    def expectedTests = 3 // keep in sync with @GameTest methods in src/.../gametest/
    doLast {
        def log = file('run/logs/latest.log')
        if (!log.exists()) {
            throw new GradleException("gametest produced no log at ${log}")
        }
        def text = log.text
        def problems = []
        def passMatcher = (text =~ /All (\d+) required tests passed/)
        if (passMatcher.find()) {
            def passed = passMatcher.group(1) as int
            if (passed != expectedTests) {
                problems << "only ${passed}/${expectedTests} tests passed"
            }
        } else if ((text =~ /\d+ required tests failed/).find()) {
            problems << "gametest reported failed tests"
        } else {
            problems << "no gametest summary found in log"
        }
        if (text.contains('Encountered an unexpected exception')) {
            problems << 'server crashed during tests'
        }
        if (problems) {
            throw new GradleException("GameTest failed: ${problems.join('; ')} - see ${log}")
        }
        logger.lifecycle("GameTest OK: all ${expectedTests} tests passed")
    }
}

// --- JUnit wiring (junit CI check) -------------------------------------------

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
